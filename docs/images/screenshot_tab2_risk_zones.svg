    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0369a1">&bull; Silhouette: 0.3406 (Peak)</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0369a1">&bull; Aggregation: 1 row/station</text>

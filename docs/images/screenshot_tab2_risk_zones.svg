      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Window Container -->
  <rect width="1200" height="740" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#winShadow2)"/>


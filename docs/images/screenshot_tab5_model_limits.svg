<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="auto">
  <defs>
    <filter id="winShadow5" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Window Container -->
  <rect width="1200" height="750" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#winShadow5)"/>

  <!-- Browser Header Bar -->
  <rect width="1200" height="42" rx="8" fill="#e2e8f0"/>
  <rect y="34" width="1200" height="8" fill="#e2e8f0"/>
  <circle cx="20" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5.5" fill="#10b981"/>
  <rect x="180" y="8" width="840" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="210" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0369a1" font-weight="500">
    🔒 https://varuna-ml.streamlit.app &bull; Tab 5: Model Limits &amp; Baselines
  </text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="270" height="708" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">🌧️ Karnataka</text>
  <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Hobli Drought-Risk Predictor</text>
  <line x1="24" y1="116" x2="246" y2="116" stroke="#cbd5e1" stroke-width="1"/>

  <g transform="translate(24, 134)">
    <rect width="222" height="130" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#991b1b">The Majority Trap</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">In 2025, 79.65% of Karnataka</text>
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">was Stable. Predicting stable</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">yields ~80% accuracy but</text>
    <text x="14" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">0.0% Drought Recall!</text>
  </g>

  <!-- Main View Area -->
  <g transform="translate(295, 42)">
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
      ⚖️ Model Limits &amp; Honest Baseline Comparisons
    </text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b">
      All numbers pulled directly from models/results.csv. Machine learning models do not clearly beat simple baselines on accuracy.
    </text>

    <!-- Navigation Tabs -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="130" height="34" rx="4" fill="#f1f5f9"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">📍 Hobli Report</text>

      <rect x="136" y="0" width="155" height="34" rx="4" fill="#f1f5f9"/>
      <text x="148" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">🌐 Risk Zones (k=4)</text>

      <rect x="297" y="0" width="150" height="34" rx="4" fill="#f1f5f9"/>
      <text x="309" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">🗺️ District Trends</text>

      <rect x="453" y="0" width="145" height="34" rx="4" fill="#f1f5f9"/>
      <text x="465" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">🔍 Data Quality</text>

      <rect x="604" y="0" width="165" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="616" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0284c7">⚖️ Model Limits</text>
    </g>

    <!-- Empirical Results Table Card -->
    <g transform="translate(0, 126)">
      <rect width="875" height="260" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
        📊 Hold-Out Test Evaluation on 2025 (850 Canonical Stations)
      </text>

      <!-- Table Header -->
      <rect x="16" y="40" width="843" height="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="26" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">MODEL / BASELINE</text>
      <text x="250" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">TYPE</text>
      <text x="360" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">5-FOLD CV ACC</text>
      <text x="490" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">TEST ACC (2025)</text>
      <text x="630" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">TEST MACRO-F1</text>
      <text x="750" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569">DROUGHT RECALL</text>

      <!-- Row 1: Most Common Class -->
      <g transform="translate(16, 70)">
        <rect width="843" height="32" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Baseline: Most Common Class</text>
        <text x="234" y="21" font-family="monospace" font-size="11" fill="#64748b">baseline</text>
        <text x="344" y="21" font-family="monospace" font-size="11" fill="#64748b">—</text>
        <text x="474" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#0284c7">0.7965</text>
        <text x="614" y="21" font-family="monospace" font-size="11.5" fill="#64748b">0.2956</text>
        <text x="734" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#dc2626">0.0000</text>
      </g>

      <!-- Row 2: Persistence -->
      <g transform="translate(16, 104)">
        <rect width="843" height="32" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Baseline: Persistence (Lag-1)</text>
        <text x="234" y="21" font-family="monospace" font-size="11" fill="#64748b">baseline</text>
        <text x="344" y="21" font-family="monospace" font-size="11" fill="#64748b">—</text>
        <text x="474" y="21" font-family="monospace" font-size="11.5" fill="#0f172a">0.6812</text>
        <text x="614" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#0284c7">0.4095</text>
        <text x="734" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#16a34a">0.1212</text>
      </g>

      <!-- Row 3: Random Forest (Winner) -->
      <g transform="translate(16, 138)">
        <rect width="843" height="32" fill="#e0f2fe" stroke="#38bdf8"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">Random Forest Classifier (Selected)</text>
        <text x="234" y="21" font-family="monospace" font-size="11" fill="#0369a1">classifier</text>
        <text x="344" y="21" font-family="monospace" font-size="11.5" fill="#0369a1">0.6581</text>
        <text x="474" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369a1">0.7082</text>
        <text x="614" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369a1">0.4077</text>
        <text x="734" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369a1">0.0606 (CV: 30.5%)</text>
      </g>

      <!-- Row 4: Gradient Boosting -->
      <g transform="translate(16, 172)">
        <rect width="843" height="32" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Gradient Boosting</text>
        <text x="234" y="21" font-family="monospace" font-size="11" fill="#64748b">classifier</text>
        <text x="344" y="21" font-family="monospace" font-size="11.5" fill="#0f172a">0.7323</text>
        <text x="474" y="21" font-family="monospace" font-size="11.5" fill="#0f172a">0.6788</text>
        <text x="614" y="21" font-family="monospace" font-size="11.5" fill="#0f172a">0.3840</text>
        <text x="734" y="21" font-family="monospace" font-size="11.5" fill="#0f172a">0.0303</text>
      </g>

      <!-- Row 5: Logistic Regression -->
      <g transform="translate(16, 206)">
        <rect width="843" height="32" fill="#fff1f2" stroke="#fecdd3"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9f1239">Logistic Regression (Balanced)</text>
        <text x="234" y="21" font-family="monospace" font-size="11" fill="#9f1239">classifier</text>
        <text x="344" y="21" font-family="monospace" font-size="11.5" fill="#9f1239">0.4464</text>
        <text x="474" y="21" font-family="monospace" font-size="11.5" font-weight="700" fill="#e11d48">0.1376</text>
        <text x="614" y="21" font-family="monospace" font-size="11.5" fill="#e11d48">0.0948</text>
        <text x="734" y="21" font-family="monospace" font-size="11.5" fill="#e11d48">0.0152 (Flood FP)</text>
      </g>
    </g>

    <!-- Side-by-Side Context Cards -->
    <g transform="translate(0, 404)">
      <!-- Left Card -->
      <rect width="425" height="260" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
        💡 Why Accuracy Alone Is Misleading Here
      </text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        1. Class Dominance: In 2025, 79.65% (677 of 850 hoblis) were in the
      </text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        stable class. A dummy model predicting "stable" scores 79.65%.
      </text>
      <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        2. Zero Utility: The majority baseline has 0.0% drought recall and
      </text>
      <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        fails to alert relief administrators of a single drought event.
      </text>
      <text x="16" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        3. Real Trade-Off: Random Forest loses 8.8 pp on accuracy to
      </text>
      <text x="16" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
        detect localized drought (30.49% CV recall across unseen districts).
      </text>

      <!-- Right Card: Regression Reality -->
      <g transform="translate(450, 0)">
        <rect width="425" height="260" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
          📉 Departure Regression vs. Baselines (MAE)
        </text>

        <g transform="translate(16, 46)">
          <rect width="393" height="34" rx="4" fill="#dcfce7" stroke="#86efac"/>
          <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Predict Zero Baseline (0.0%): MAE = 21.65%</text>
        </g>
        <g transform="translate(16, 88)">
          <rect width="393" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Predict Train Mean Baseline (+29.5%): MAE = 24.53%</text>
        </g>
        <g transform="translate(16, 130)">
          <rect width="393" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Gradient Boosting Regressor: MAE = 24.42%</text>
        </g>
        <g transform="translate(16, 172)">
          <rect width="393" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Random Forest Regressor: MAE = 26.35%</text>
        </g>
        <g transform="translate(16, 214)">
          <rect width="393" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Ridge Regression: MAE = 53.79% (DROPPED)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
